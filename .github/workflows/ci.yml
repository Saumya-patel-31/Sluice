name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.6"   # floor set by govulncheck; see go.mod

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi


      # Git for Windows cannot detect the executable bit, so a script authored
      # there is committed 100644 and every `./scripts/foo.sh` in this pipeline
      # becomes "Permission denied" on the runner. That is how the Kubernetes

      # Container registries reject an uppercase repository name. This account's
      # GitHub repo is `Saumya-patel-31/Sluice`, so anything derived from it —
      # a manifest, a chart default, `${{ github.repository }}` in the release
      # workflow — is wrong in a way that only shows up at the first push to
      # GHCR, long after it was written.
      - name: Image references are lowercase
        run: |
          bad=$(grep -rnE 'ghcr\.io/[^ "'"'"']*[A-Z]' \
                  --include='*.yaml' --include='*.yml' \
                  --include='Makefile' --include='Dockerfile' \
                  . | grep -v HARDENING-LOG || true)
          if [ -n "$bad" ]; then
            echo "these image references contain uppercase and registries will reject them:"
            echo "$bad"
            exit 1
          fi
      # job first failed, and it would come back with the next script.
      - name: Shell scripts are executable
        run: |
          bad=$(git ls-files --stage '*.sh' | awk '$1 != "100755" {print $4}')
          if [ -n "$bad" ]; then
            echo "these scripts are not executable in git:"
            echo "$bad"
            echo
            echo "fix with: git update-index --chmod=+x <file>"
            exit 1
          fi
      - name: Vet
        run: go vet ./...

      # The race detector needs a 64-bit C toolchain, which is why this runs
      # on Linux. The control plane is heavily concurrent — a control loop
      # swapping state under a request path, a ledger fanning out to
      # subscribers, sharded caches — so this is the check that matters most.
      - name: Test with the race detector
        run: go test -race -count=2 ./...

      # The benchmarks are the evidence for the claim that a routing decision
      # belongs inline in a request path. Timings are not asserted — these are
      # shared runners and consecutive runs vary by 2x — but they must keep
      # compiling and running, and the allocation budgets in
      # internal/router/alloc_test.go, which do not vary at all, are enforced by
      # the suite above.
      - name: Benchmarks still run
        run: go test ./internal/router -bench . -benchtime=10x -run '^$' 2>/dev/null

      - name: Coverage
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tail -n 1

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build:
    name: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::8}" ./...

  policy:
    name: policy compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Start the control plane against the demo topology, let it accumulate
      # some traffic, then backtest the shipped policy document against it.
      # `sluicectl policy test` exits non-zero when traffic that flows today
      # would be refused, which makes this a real gate rather than a syntax
      # check.
      - name: Backtest the shipped policy document
        run: |
          # Loopback, not :8080. The control plane refuses to start bound to a
          # routable address without an API token, and this job talks to
          # localhost, so loopback is the honest configuration rather than
          # reaching for --dev-insecure to silence the check.
          go run ./cmd/sluiced --demo --listen 127.0.0.1:8080 --log-level warn &
          SLUICED=$!
          trap 'kill $SLUICED' EXIT

          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/readyz >/dev/null; then break; fi
            sleep 1
          done
          sleep 10   # let the ledger fill

          go run ./cmd/sluicectl --addr http://localhost:8080 status
          go run ./cmd/sluicectl --addr http://localhost:8080 backends
          go run ./cmd/sluicectl --addr http://localhost:8080 policy test configs/policies.sluice

  docker:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sluice:ci
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          # No arguments: use the image's own CMD. Overriding it with --demo
          # replaces the whole command, dropping --listen 0.0.0.0:8080, and the
          # process then binds loopback *inside* the container where -p cannot
          # reach it. Running the default is also what a user actually gets.
          docker run -d --name sluice -p 8080:8080 sluice:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/readyz >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8080/api/status | head -c 400; echo
          # The exposition must actually contain series, not just parse.
          curl -sf http://localhost:8080/metrics | grep -q '^sluice_decisions_total'
          docker rm -f sluice

  helm:
    name: chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Lint and render
        run: |
          COMMON="--set api.token=lint-only --set dataPlane.tls.existingSecret=lint-only"
          helm lint deploy/helm/sluice $COMMON
          helm template sluice deploy/helm/sluice $COMMON > /dev/null
          helm template sluice deploy/helm/sluice $COMMON \
            --set serviceMonitor.enabled=true > /dev/null
          helm template sluice deploy/helm/sluice --set api.token=lint-only \
            --set dataPlane.enabled=false > /dev/null

      # The chart must refuse to render an unauthenticated write API, the same
      # way the binary refuses to start with one.
      - name: The chart rejects a missing API token
        run: |
          if helm template sluice deploy/helm/sluice >/dev/null 2>&1; then
            echo "chart rendered without an API token — the guard is broken"
            exit 1
          fi
          echo "chart correctly refuses to render without a token"

      # Envoy terminates mutual TLS. Rendering a data plane with no server
      # certificate would produce pods that cannot start, discovered at rollout
      # rather than at template time.
      - name: The chart rejects a data plane with no TLS secret
        run: |
          if helm template sluice deploy/helm/sluice \
               --set api.token=lint-only >/dev/null 2>&1; then
            echo "chart rendered a data plane without TLS material"
            exit 1
          fi
          echo "chart correctly refuses to render a data plane without certificates"

      # Rendering is not loading. The chart builds its Envoy bootstrap from a
      # generated prelude plus clusters derived from .Values.backends, and a
      # bootstrap that fails to load takes the whole data plane with it — so the
      # config the chart would actually install is put through Envoy itself.
      - name: The chart's Envoy bootstrap loads
        run: |
          helm template sluice deploy/helm/sluice \
            --set api.token=lint-only \
            --set dataPlane.tls.existingSecret=sluice-certs > /tmp/rendered.yaml
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open("/tmp/rendered.yaml")) if d]
          cm = next(d for d in docs if d["kind"] == "ConfigMap"
                    and d["metadata"]["name"].endswith("-envoy"))
          boot = cm["data"]["envoy.yaml"]
          open("/tmp/envoy-from-chart.yaml", "w").write(boot)
          names = [c["name"] for c in yaml.safe_load(boot)["static_resources"]["clusters"]]
          print("clusters:", ", ".join(names))
          # One authz cluster plus one per enabled backend. A cluster missing
          # here is a backend Sluice can choose and Envoy cannot reach.
          assert len(names) == 4, f"expected 4 clusters, got {names}"
          PY

          mkdir -p /tmp/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/certs/server.key -out /tmp/certs/server.crt \
            -subj "/CN=validate" 2>/dev/null
          cp /tmp/certs/server.crt /tmp/certs/ca.crt
          chmod 644 /tmp/certs/*

          docker run --rm \
            -v "/tmp/envoy-from-chart.yaml:/etc/envoy/envoy.yaml:ro" \
            -v "/tmp/certs:/etc/sluice/certs:ro" \
            envoyproxy/envoy:v1.32-latest \
            --mode validate -c /etc/envoy/envoy.yaml

  envoy:
    name: envoy config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A bootstrap that fails to load takes the entire data plane with it, and
      # the failure modes are subtle: a YAML merge key Envoy does not implement
      # rejects the whole file, and a missing route-cache invalidation makes
      # every request 503 while ext_authz reports success. Both shipped once.
      # This is the cheapest possible guard against the first.
      - name: Validate the bootstrap
        run: |
          mkdir -p /tmp/certs
          # Validation loads the referenced certificate paths, so give it
          # throwaway ones.
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/certs/server.key -out /tmp/certs/server.crt \
            -subj "/CN=validate" 2>/dev/null
          cp /tmp/certs/server.crt /tmp/certs/ca.crt
          # openssl writes the key 0600 owned by the runner; Envoy runs as uid
          # 101 and cannot read it, so validation fails on the key rather than
          # on anything to do with the config. These are throwaway certs.
          chmod 644 /tmp/certs/*

          docker run --rm \
            -v "$PWD/deploy/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro" \
            -v "/tmp/certs:/etc/sluice/certs:ro" \
            envoyproxy/envoy:v1.32-latest \
            --mode validate -c /etc/envoy/envoy.yaml

      # The Kubernetes data plane is rendered from the bootstrap above rather
      # than maintained as a second copy, so a fix to one cannot miss the
      # other. This fails if the checked-in render is stale.
      - name: The Kubernetes render is up to date
        run: |
          ./scripts/render-k8s-envoy.sh /tmp/15-envoy.check.yaml
          diff -u deploy/k8s/15-envoy.yaml /tmp/15-envoy.check.yaml || {
            echo "deploy/k8s/15-envoy.yaml is stale; run: make envoy-render"
            exit 1
          }

  stack:
    name: end-to-end stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The integration this project exists to demonstrate. It has broken twice
      # in ways every unit test passed through, so it is exercised for real:
      # mutual TLS, a live Envoy, three upstreams on separate hosts.
      - name: Bring up the stack
        run: |
          docker compose -f deploy/docker-compose.yml up --build -d
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/readyz >/dev/null && break || sleep 2
          done
          docker compose -f deploy/docker-compose.yml ps

      - name: Authorised traffic reaches an upstream
        run: |
          docker run --rm --network sluice_default -v sluice_certs:/certs:ro \
            curlimages/curl:latest -sf \
            --cacert /certs/ca.crt --cert /certs/feed.crt --key /certs/feed.key \
            https://envoy:10000/api/v1/feed -o /dev/null

      - name: An untrusted identity is refused
        run: |
          code=$(docker run --rm --network sluice_default -v sluice_certs:/certs:ro \
            curlimages/curl:latest -s -o /dev/null -w '%{http_code}' \
            --cacert /certs/ca.crt --cert /certs/intruder.crt --key /certs/intruder.key \
            https://envoy:10000/api/v1/feed)
          [ "$code" = "403" ] || { echo "expected 403, got $code"; exit 1; }

      - name: Requests actually landed on upstreams
        run: |
          total=0
          for u in aws gcp azure; do
            n=$(docker compose -f deploy/docker-compose.yml exec -T upstream-$u \
              wget -qO- http://127.0.0.1:8080/stats | grep -o '"served":[0-9]*' | cut -d: -f2)
            echo "upstream-$u served $n"
            total=$((total + n))
          done
          # Zero here is the exact symptom of the route-cache bug: everything
          # looks healthy and no traffic ever arrives.
          [ "$total" -gt 0 ] || { echo "no upstream served any request"; exit 1; }

      - name: Prometheus is scraping both planes
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:9090/-/ready >/dev/null && break || sleep 2
          done
          down=$(curl -s 'http://localhost:9090/api/v1/targets?state=active' \
            | python3 -c 'import json,sys; print(sum(1 for t in json.load(sys.stdin)["data"]["activeTargets"] if t["health"]!="up"))')
          [ "$down" = "0" ] || { echo "$down scrape target(s) unhealthy"; exit 1; }
          # A malformed rule file loads as zero groups rather than failing, so
          # assert the alerting rules are actually there.
          groups=$(curl -s http://localhost:9090/api/v1/rules \
            | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["data"]["groups"]))')
          [ "$groups" -gt 0 ] || { echo "no alerting rules loaded"; exit 1; }
          echo "targets healthy, $groups rule groups loaded"

      # A panel querying a renamed metric renders an empty graph rather than
      # failing — which looks exactly like "nothing is happening", and is
      # silent precisely when someone is relying on it during an incident.
      # This executes every panel query through Grafana's own datasource proxy.
      - name: Every dashboard panel returns data
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health >/dev/null && break || sleep 2
          done
          python3 scripts/check-dashboard.py --live http://localhost:3000

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  kubernetes:
    name: kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The manifests spent a long time as YAML nobody had applied. Rendering
      # is not deploying and deploying is not routing: the first real apply
      # failed on an unordered Secret, and the first successful rollout — every
      # pod Ready, every probe green — denied 100% of legitimate traffic
      # because the certificates carried a trust domain the policy did not
      # recognise. Neither is visible without a cluster, so CI gets one.
      - name: Create a cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: sluice
          wait: 120s

      - name: Build and load the image
        run: |
          docker build -t ghcr.io/saumya-patel-31/sluice:latest \
            --build-arg VERSION=${GITHUB_SHA::8} .
          kind load docker-image ghcr.io/saumya-patel-31/sluice:latest --name sluice

      - name: Deploy
        run: make k8s-deploy

      # Drives real mutual-TLS traffic through Envoy from inside the cluster
      # and asserts where it landed — including that an anonymous caller is
      # refused at the handshake and an untrusted identity gets a 403.
      - name: Verify routing end to end
        run: make k8s-verify

      - name: Dump state on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n sluice describe pods || true
          kubectl -n sluice logs -l app.kubernetes.io/name=sluice --tail=80 || true
          kubectl -n sluice logs -l app.kubernetes.io/name=envoy --tail=40 || true
