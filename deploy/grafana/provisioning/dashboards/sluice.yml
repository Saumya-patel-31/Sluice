apiVersion: 1

providers:
  - name: sluice
    orgId: 1
    folder: Sluice
    type: file
    # The dashboard is version-controlled, so editing it in the UI and losing
    # the change on the next deploy would be the worse surprise.
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
