# End-to-end Sluice deployment: a real Envoy data plane, three synthetic
# regions on separate hosts, and the control plane deciding between them.
#
#   docker compose -f deploy/docker-compose.yml up --build
#
#   dashboard   http://localhost:8080
#   metrics     http://localhost:8080/metrics
#   envoy admin http://localhost:9901
#
# Traffic goes through Envoy over mutual TLS, because the identity Sluice
# authorises on has to come from somewhere a caller cannot forge:
#
#   curl --cacert certs/ca.crt --cert certs/feed.crt --key certs/feed.key \
#        https://localhost:10000/api/v1/feed -D-
#
# Envoy verifies that certificate, generates the x-forwarded-client-cert header
# from its URI SAN, and Sluice reads the SPIFFE ID out of it. A caller cannot
# set that header itself — Envoy's forward_client_cert_details defaults to
# SANITIZE and strips inbound copies, which is why a plain HTTP request is
# anonymous and the baseline policy refuses it.
#
# The `certs` service below generates a local CA and workload certificates into
# a shared volume on first run, so this is still a single command.

name: sluice

services:
  # ── Local PKI ──────────────────────────────────────────────────────────────
  # Runs to completion before anything that needs certificates starts.
  certs:
    image: alpine:3.21
    volumes:
      - certs:/out
      - ../scripts/gen-certs.sh:/gen-certs.sh:ro
    command:
      - /bin/sh
      - -c
      - |
        set -e
        if [ -f /out/ca.crt ]; then echo "certificates already present"; exit 0; fi
        apk add --no-cache openssl >/dev/null
        sh /gen-certs.sh /out
        # Envoy runs as a non-root user and has to read the server key.
        chmod 644 /out/*.key
    restart: "no"

  # ── Control plane ──────────────────────────────────────────────────────────
  sluiced:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: compose
    command:
      - --config=/etc/sluice/sluice.jsonc
      - --log-level=info
    environment:
      # The control-plane API can replace the document that authorises every
      # request in the fleet, so mutating calls need this token:
      #
      #   curl -X PUT -H "Authorization: Bearer $${SLUICE_API_TOKEN:-compose-demo-token}" ...
      #
      # Override it, or better, point SLUICE_API_TOKEN_FILE at a mounted secret.
      SLUICE_API_TOKEN: ${SLUICE_API_TOKEN:-compose-demo-token}
      SLUICE_LISTEN_API: 0.0.0.0:8080
      SLUICE_LISTEN_AUTHZ: 0.0.0.0:8081
    volumes:
      - ../configs/compose.jsonc:/etc/sluice/sluice.jsonc:ro
      - ../configs/policies.sluice:/etc/sluice/policies.sluice:ro
    ports:
      - "8080:8080"   # dashboard, REST API, /metrics
      - "8081:8081"   # Envoy ext_authz
    depends_on:
      upstream-aws: { condition: service_healthy }
      upstream-gcp: { condition: service_healthy }
      upstream-azure: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ── Data plane ─────────────────────────────────────────────────────────────
  envoy:
    image: envoyproxy/envoy:v1.32-latest
    command: ["-c", "/etc/envoy/envoy.yaml", "--service-cluster", "sluice-edge"]
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - certs:/etc/sluice/certs:ro
    ports:
      - "10000:10000"  # proxied traffic, mutual TLS
      - "9901:9901"    # Envoy admin
    depends_on:
      sluiced: { condition: service_healthy }
      certs: { condition: service_completed_successfully }
    restart: unless-stopped

  # ── Synthetic regions ──────────────────────────────────────────────────────
  # A few milliseconds behind GCP, at 25% lower egress cost and on the same
  # fossil-heavy grid. This is where cost-aware routing should send most
  # interactive traffic.
  upstream-aws:
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["/usr/local/bin/sluice-upstream"]
    environment:
      REGION: us-east-1
      LATENCY_MS: "24"
      ERROR_RATE: "0.001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  # The fastest region, and the most expensive egress of the three — Google's
  # premium tier lists at $0.12/GB against Azure's $0.087. A latency-only
  # balancer sends everything here and pays that premium on every byte.
  upstream-gcp:
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["/usr/local/bin/sluice-upstream"]
    environment:
      REGION: us-central1
      LATENCY_MS: "20"
      ERROR_RATE: "0.0015"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  # Cheapest egress and roughly six times cleaner per byte, but 80ms away.
  # Batch traffic should drift here; the interactive SLO should keep it out.
  upstream-azure:
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["/usr/local/bin/sluice-upstream"]
    environment:
      REGION: francecentral
      LATENCY_MS: "88"
      ERROR_RATE: "0.001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  # ── Load ───────────────────────────────────────────────────────────────────
  # A trickle of authenticated traffic so the dashboard has something to show
  # without anyone having to drive it by hand. Remove this service to observe a
  # quiet system.
  loadgen:
    image: alpine:3.21
    depends_on:
      envoy: { condition: service_started }
      certs: { condition: service_completed_successfully }
    volumes:
      - certs:/certs:ro
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl >/dev/null
        CA="--cacert /certs/ca.crt"
        FEED="$$CA --cert /certs/feed.crt --key /certs/feed.key"
        ETL="$$CA --cert /certs/etl.crt --key /certs/etl.key"
        CHECKOUT="$$CA --cert /certs/checkout.crt --key /certs/checkout.key"
        while true; do
          # Interactive reads: a web workload, latency-weighted route.
          for i in 1 2 3 4 5; do
            curl -s -o /dev/null $$FEED -H 'x-sluice-bytes: 8192' \
              https://envoy:10000/api/v1/feed &
          done
          # Batch: trades latency for cheaper, cleaner egress.
          curl -s -o /dev/null $$ETL -H 'x-sluice-bytes: 262144' \
            https://envoy:10000/batch/reindex &
          # Payments: requires mTLS, weighted for reliability.
          curl -s -o /dev/null $$CHECKOUT -H 'x-sluice-bytes: 2048' \
            https://envoy:10000/api/payments/charge &
          # An identity from an untrusted domain — chains to the same CA, so
          # this proves the trust-domain check does real work.
          curl -s -o /dev/null $$CA --cert /certs/intruder.crt --key /certs/intruder.key \
            https://envoy:10000/api/v1/feed &
          sleep 0.4
        done
    restart: unless-stopped

volumes:
  # Local CA and workload certificates, generated on first run by the `certs`
  # service. `docker compose down -v` discards them and the next run makes a
  # fresh set.
  certs:
