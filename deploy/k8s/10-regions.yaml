# The three "cloud regions" the control plane routes between.
#
# Each is its own namespace with a `checkout` Service, so the DNS names match
# what the control plane's configuration already expects:
#
#   checkout.aws-us-east-1.svc.cluster.local
#   checkout.gcp-us-central1.svc.cluster.local
#   checkout.azure-francecentral.svc.cluster.local
#
# In a real deployment these are separate clusters in separate providers and
# the addresses are external. Modelling them as namespaces keeps the DNS shape
# identical while fitting on one machine, so the manifests exercise the same
# resolution path they would in production.
#
# The latency and cost characteristics mirror the compose demo: us-central1 is
# the fastest region and also the most expensive egress, which is the case
# cost-aware routing exists to catch.
---
apiVersion: v1
kind: Namespace
metadata:
  name: aws-us-east-1
  labels: { sluice.dev/region: "true" }
---
apiVersion: v1
kind: Namespace
metadata:
  name: gcp-us-central1
  labels: { sluice.dev/region: "true" }
---
apiVersion: v1
kind: Namespace
metadata:
  name: azure-francecentral
  labels: { sluice.dev/region: "true" }
---
# Mid-priced egress, fossil-heavy PJM grid, a few ms behind GCP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: aws-us-east-1
  labels: { app.kubernetes.io/name: checkout, sluice.dev/region: us-east-1 }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: checkout }
  template:
    metadata:
      labels: { app.kubernetes.io/name: checkout, sluice.dev/region: us-east-1 }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: upstream
          image: ghcr.io/saumya-patel-31/sluice:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/sluice-upstream"]
          env:
            - { name: REGION,     value: "us-east-1" }
            - { name: LATENCY_MS, value: "24" }
            - { name: ERROR_RATE, value: "0.001" }
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits:   { cpu: 500m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: aws-us-east-1
spec:
  selector: { app.kubernetes.io/name: checkout }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
# Fastest region, and the most expensive egress of the three.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: gcp-us-central1
  labels: { app.kubernetes.io/name: checkout, sluice.dev/region: us-central1 }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: checkout }
  template:
    metadata:
      labels: { app.kubernetes.io/name: checkout, sluice.dev/region: us-central1 }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: upstream
          image: ghcr.io/saumya-patel-31/sluice:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/sluice-upstream"]
          env:
            - { name: REGION,     value: "us-central1" }
            - { name: LATENCY_MS, value: "20" }
            - { name: ERROR_RATE, value: "0.0015" }
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits:   { cpu: 500m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: gcp-us-central1
spec:
  selector: { app.kubernetes.io/name: checkout }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
# Cheapest egress and roughly seven times cleaner, but 88ms away.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: azure-francecentral
  labels: { app.kubernetes.io/name: checkout, sluice.dev/region: francecentral }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: checkout }
  template:
    metadata:
      labels: { app.kubernetes.io/name: checkout, sluice.dev/region: francecentral }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: upstream
          image: ghcr.io/saumya-patel-31/sluice:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/sluice-upstream"]
          env:
            - { name: REGION,     value: "francecentral" }
            - { name: LATENCY_MS, value: "88" }
            - { name: ERROR_RATE, value: "0.001" }
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits:   { cpu: 500m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: azure-francecentral
spec:
  selector: { app.kubernetes.io/name: checkout }
  ports:
    - { name: http, port: 8080, targetPort: http }
